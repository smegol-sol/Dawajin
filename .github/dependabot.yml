# فحص التبعيات — القرار 209 (الحكم الثاني)، والتنفيذ بالقرار 214.
#
# **وهذا الملف نصفُ الحكم لا كلّه:** يُعرَّف هنا **تحديثُ الإصدارات**
# (version updates). **و«يفتح PR عند كل ثغرة ويحمل إصلاحها» في القرار 209 هو
# «تحديثات الأمان» (Dependabot security updates)** — **وهي إعداد مستودع في
# Settings ← Code security لا سطرٌ في هذا الملف**، فيُفعّلها صاحب الصلاحية.
# **وخطوة البوابة التي تُسقط البناء على الحرج والعالي وحدهما تبقى في
# `ci.yml`** — **وتحتاج صلاحية `workflow`**، فيضيفها المراجع (القرار 206).

version: 2

updates:
  # **خمسة `package.json` لا واحد** — والجذر وحده لا يغطّي الحزم: Dependabot
  # يُعدّل **بيانَ الحزمة** (manifest)، وتبعيات `apps/api` معلَنة في بيانها هي.
  # **والأنماط تُنسخ من `pnpm-workspace.yaml` لا تُعدّ يدويًّا** (`apps/*` و
  # `packages/*`) — **فحزمةٌ جديدة تدخل الفحص بلا تعديل هنا**، ولا يبقى مصدران
  # للحقيقة يتفارقان. **وقفل `pnpm-lock.yaml` واحدٌ في الجذر ويُحدَّث معها.**
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*"
    schedule:
      # **الوتيرة ليست في القرار 209** — والحقل إلزاميّ فلا يُكتب الملف بدونه.
      # **فـ«أسبوعيًّا» اقتراحٌ معلَّق لا قرار** (القرار 214): مشتقٌّ من علّة
      # 209 نفسها — «يقرأ النتيجة في نفس القائمة التي يقرأها» — **وقائمةٌ
      # تُغرَق لا تُقرأ**. **وتحديثات الأمان لا تنتظر هذه الوتيرة أصلًا.**
      interval: "weekly"
    # **والتجميع لنفس العلّة:** خمسة بيانات × تبعياتها **تُنتج قائمةً تُهجَر**.
    # والحرج والعالي يصلان بتحديثات الأمان لا من هنا.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  # **وإجراءات CI تتقادم كما تتقادم الحزم** — وثلاثةٌ مثبَّتة بوسم رئيسيّ في
  # `ci.yml`: `actions/checkout@v4` · `pnpm/action-setup@v4` ·
  # `actions/setup-node@v4`. **وموضعها الجذر دائمًا** (`.github/workflows`).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
