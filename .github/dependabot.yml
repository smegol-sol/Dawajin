# فحص التبعيات — القرار 209 (الحكم الثاني)، والتنفيذ 214، والتضييق 217.
#
# **وهذا الملف نصفُ الحكم لا كلّه:** يُعرَّف هنا **تحديثُ الإصدارات**
# (version updates). **و«يفتح PR عند كل ثغرة ويحمل إصلاحها» في القرار 209 هو
# «تحديثات الأمان» (Dependabot security updates)** — **وهي إعداد مستودع في
# Settings ← Code security لا سطرٌ في هذا الملف**. **وخطوة البوابة التي تُسقط
# البناء على الحرج والعالي وحدهما تبقى في `ci.yml`** وتحتاج صلاحية `workflow`.

version: 2

updates:
  # **مدخلٌ واحد على الجذر — وهو يغطّي مساحة العمل كلها** (القرار 217).
  #
  # **مقيسٌ لا مفترَض:** فرعُ Dependabot الصادر عن هذا المدخل عدّل
  # `apps/mobile/package.json` وحده لترقية `expo-secure-store` — **وهي غير
  # معلَنة في بيان الجذر إطلاقًا**؛ وفرعٌ آخر منه عدّل `apps/api/package.json`
  # **و**`packages/shared/package.json` معًا لترقية `vitest`. **فالجذر يبلغ
  # بيانات الأعضاء ويُحدّثها.**
  #
  # **وأنماط `/apps/*` و`/packages/*` كانت تُكرّر ما يفعله الجذر لا تُكمله** —
  # **فأنتجت PRين لكل ترقية** (#93 و#94 و#95 تكرّر #96 و#97 و#98). **وحُذفت.**
  #
  # **وميزةٌ ثانية للجذر تُكتب لأنها ليست ظاهرة:** تبعيةٌ معلَنة في بيانين
  # يُحدّثها الجذر **في PR واحدة**، **والأنماط تُحدّثها في اثنتين مستقلّتين**
  # — **فتتفارق النسختان**، وهو بعينه ما كسر قِران `vitest` و
  # `@vitest/coverage-v8` في القرار 216.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      # **الوتيرة ليست في القرار 209** — والحقل إلزاميّ فلا يُكتب الملف بدونه.
      # **فـ«أسبوعيًّا» اقتراحٌ معلَّق لا قرار** (القرار 214)، مشتقٌّ من علّة
      # 209: «يقرأ النتيجة في نفس القائمة التي يقرأها» — **وقائمةٌ تُغرَق لا
      # تُقرأ**. **وتحديثات الأمان لا تنتظر هذه الوتيرة أصلًا.**
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  # **وإجراءات CI تتقادم كما تتقادم الحزم** — وموضعها الجذر دائمًا
  # (`.github/workflows`). **ولم تُنتج تكرارًا**، فتبقى كما هي.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
