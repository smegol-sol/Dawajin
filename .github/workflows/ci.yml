name: CI

on:
  pull_request:
  push:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dawajin
          POSTGRES_PASSWORD: dawajin_ci_password
          POSTGRES_DB: dawajin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dawajin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://dawajin:dawajin_ci_password@localhost:5432/dawajin_test
      TEST_DATABASE_URL: postgres://dawajin:dawajin_ci_password@localhost:5432/dawajin_test
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # لازم لفحص رسائل commit مقابل الفرع الأساس

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # تأكيدات التخطيط (القرار #81) تحتاج متصفحًا حقيقيًا — Chromium وحده،
      # لا كل المتصفحات. تبعية مشروع لا تثبيت عالمي: النسخة مثبَّتة في
      # pnpm-lock.yaml فلا ينحرف سلوك CI عن المحلي بترقية صامتة.
      - name: تثبيت متصفح تأكيدات التخطيط
        run: npx playwright install --with-deps chromium

      # يُفحص نطاق الـPR فقط — رسائل ما قبل تبنّي القاعدة لا تُعاد كتابتها (القرار #64)
      - name: صيغة رسائل commit (conventional commits)
        if: github.event_name == 'pull_request'
        run: npx tsx scripts/check-commit-messages.ts origin/${{ github.base_ref }}

      - name: تطبيق الترحيلات على قاعدة الاختبار
        run: pnpm --filter @dawajin/db run migrate

      - name: تجهيز جدول علامة الاختبار
        run: pnpm --filter @dawajin/db run setup:test-db

      # check:all يشمل typecheck وESLint وPrettier والتغطية (القرار #61 و#63)
      # — التغطية تشغّل الاختبارات نفسها، فالخطوتان التاليتان تبقيان لعزل
      # سبب الفشل بوضوح في سجل CI لا لتكرار عمل ضروري.
      # check:all يشمل الآن الفاحص الأخير (تأكيدات تخطيط RTL) الذي يبني
      # مخرَج الويب ويشغّل Playwright — لا خطوة منفصلة له.
      - name: الفحوص الآلية (typecheck · ESLint · Prettier · تغطية · تخطيط · بنيوية)
        run: pnpm run check:all

      - name: اختبارات الوحدة
        run: pnpm run test

      - name: اختبارات التكامل
        run: pnpm run test:integration
